[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kraken-api-mcp"
version = "0.1.0"
description = "Kraken Spot + Futures MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.3.0",
    "httpx[http2]>=0.27.0",
    "websockets>=13.0",
    "pydantic>=2.7.0",
    "anyio>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx>=0.27.0",
]

[project.scripts]
kraken-mcp = "kraken_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["kraken_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
